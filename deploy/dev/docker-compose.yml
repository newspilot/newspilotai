# Local development database. Not for production.
#
#   cp deploy/dev/.env.example deploy/dev/.env   # then put your own values in .env (it is git-ignored)
#   docker compose -f deploy/dev/docker-compose.yml --env-file deploy/dev/.env up -d
#
# This creates the database plus two roles: newspilot_owner (owns the tables, runs migrations) and newspilot_app (what
# the engine connects as; row-level security applies to it). See docs/database.md.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/dev/.env}
      NEWSPILOT_OWNER_PASSWORD: ${NEWSPILOT_OWNER_PASSWORD:?set NEWSPILOT_OWNER_PASSWORD in deploy/dev/.env}
      NEWSPILOT_APP_PASSWORD: ${NEWSPILOT_APP_PASSWORD:?set NEWSPILOT_APP_PASSWORD in deploy/dev/.env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./initdb:/docker-entrypoint-initdb.d:ro
      - newspilot-dev-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

volumes:
  newspilot-dev-db:
