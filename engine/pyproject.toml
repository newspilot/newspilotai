[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "newspilot"
version = "0.0.1"
description = "NewsPilot AI engine: human-approved, source-cited news automation"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.7,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/newspilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]  # fixture values in tests are not secrets
