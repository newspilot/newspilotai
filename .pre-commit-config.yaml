repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff
        args: [--fix]
        files: ^engine/
      - id: ruff-format
        files: ^engine/
  - repo: local
    hooks:
      - id: check-neutral
        name: core stays subject-neutral
        entry: python scripts/check_neutral.py
        language: system
        pass_filenames: false
